name: cicd

#it runs manually whenever user needs
on:
  workflow_dispatch:
jobs:
  job1:
  #here every job needs runner to run
    runs-on: ubuntu-22.04
    steps:
       - name: code clone
         run: echo "clone done"
   
  job2:
    needs: [job1]
    runs-on: ubuntu-22.04
    steps:
       - name: code build
         run: echo "build done"
   
      
      
  job3:
     needs: [job1,job2]
     runs-on: ubuntu-22.04
     steps:
      - name: code test
        run: echo "test run"
  job4:
     needs: [job3,job2]
     runs-on: ubuntu-22.04
     steps:
   
      - name: code deploy
        run: echo "code deploy"
   
     
   
