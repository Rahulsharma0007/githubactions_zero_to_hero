name: Dockerfile

on: 
    push:
        branches: [main]

jobs:
    build-push:
        runs-on: ubuntu-latest
        steps:
        - name: code checkout
          uses: actions/checkout@v4

        - name: Login to Dockehub
          uses: docker/login-action@v4
          with:
            
            username: ${{ vars.DOCKERHUB_USER }}
            secrets: ${{ secrets.DOCKERHUB_TOKEN }}

        - name: Build and Push to Dockerhub
          uses: docker/build-push-action@v7
          with:
            context: .  # it means where is docker file
            push: true
            tags: |
             ${{vars.DOCKERHUB_USER}}/github-actions-app:${{github.ref_name}}
             ${{vars.DOCKERHUB_USER}}/github-actions-app:latest
             ${{vars.DOCKERHUB_USER}}/github-actions-app:${{github.sha}}
