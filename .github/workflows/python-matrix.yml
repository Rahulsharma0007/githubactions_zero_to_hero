name: python lint

on: 
    push:
        branches: [main]
    workflow_dispatch:   

jobs:
    Job1:
        runs-on: ubuntu-latest

        steps: 
            - name: checkout code
              uses: actions/checkout@v4

            - name: setup python
              uses: actions/setup-python@v6
              with:
                python-version: 3.13
            - name: install requirements
              run: pip installc -r requirements.txt
            - name: run linter
              run: flake8 app.py


        