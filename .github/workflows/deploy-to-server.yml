name: deploy to server 

on:
    workflow_call:

jobs:
    deploy:
        
        runs-on: ubuntu-latest
        env:
            DOCKERHUB_USER: ${{ vars.DOCKERHUB_USER }}
            DOCKER_TAG: ${{ github.sha }}

        steps:

            - name: SSH to prod server and create app folder
              uses: appleboy/ssh-action@v1.0.3

              with:
                    host: ${{ secrets.EC2_SSH_HOST }}
                    username: ${{ secrets.EC2_SSH_USER }}
                    key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
                    script: |
                        echo "Installing new packages and folders"
                        sudo apt-get update && sudo apt-get install docker.io docker-compose-v2 -y
                        sudo usermod -aG docker $USER && newgrp docker
                        mkdir -p Amazing
            - name: checkout code
              uses: actions/checkout@v4
            - name: copy the docker compose file
              uses: appleboy/scp-action@v1
              with:
               host: ${{ secrets.EC2_SSH_HOST }}
               username: ${{ secrets.EC2_SSH_USER }}
               key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
               source: docker-compose.yml
               target: ~/devops

            - name: SSH again and run the app
              uses: appleboy/ssh-action@v1.0.3

              with:
                host: ${{ secrets.EC2_SSH_HOST }}
                username: ${{ secrets.EC2_SSH_USER }}
                key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
                script: |
                    echo " running app"
                    
                    export  DOCKERHUB_USER=${{ vars.DOCKERHUB_USER }}
                    export  DOCKER_TAG=${{ github.sha }}
                    echo ${{ secrets.DOCKERHUB_TOKEN }} | docker login --username  ${{ vars.DOCKERHUB_USER}} --password-stdin
                    cd ~/devops && docker compose up -d --build --force-recreate --pull always